name: Збірка

# Збирає програму для Windows і macOS.
# - кожен push у main: готові файли з'являються у вкладці Actions → запуск → Artifacts
# - тег vX.Y.Z (наприклад v1.0.0): створюється Release із файлами для завантаження
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Inventar-Windows
          - os: macos-latest
            artifact: Inventar-macOS
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Встановити залежності
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Перевірка синтаксису
        run: python -m py_compile app.py db.py

      - name: Зібрати (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --windowed --onefile --name Inventar app.py
          Compress-Archive -Path dist/Inventar.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: Зібрати (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name Inventar app.py
          ditto -c -k --keepParent dist/Inventar.app ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
