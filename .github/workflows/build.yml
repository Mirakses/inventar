name: Збірка

# Збирає програму для Windows і macOS.
# - кожен push у main: готові файли з'являються у вкладці Actions → запуск → Artifacts
# - якщо в app.py змінився __version__ і релізу з такою версією ще немає,
#   автоматично створюється Release vX.Y.Z із файлами для завантаження
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Inventar-Windows
          - os: macos-latest
            artifact: Inventar-macOS
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Встановити залежності
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Перевірка синтаксису
        run: python -m py_compile app.py db.py cloud.py ui_cloud.py cloud_config.py

      - name: Тести синхронізації
        run: python -m tests.test_sync

      - name: Зібрати (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --windowed --onefile --name Inventar --icon assets/icon.ico --add-data "assets/icon.png:assets" --collect-submodules supabase app.py
          $p = Start-Process dist/Inventar.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
          Compress-Archive -Path dist/Inventar.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: Зібрати (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name Inventar --icon assets/icon.icns --add-data "assets/icon.png:assets" --collect-submodules supabase app.py
          dist/Inventar.app/Contents/MacOS/Inventar --selftest
          ditto -c -k --keepParent dist/Inventar.app ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Визначити версію
        id: ver
        run: |
          V=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('app.py', encoding='utf-8').read()).group(1))")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "Реліз v$V уже існує — пропускаю"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.new == 'true'
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.new == 'true'
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Облік майна ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: "*.zip"
          generate_release_notes: true
